name: nebensound

# This repository calls the central pipeline for its checks.
#
# The pipeline has no release yet, so the workflow is pinned to a full commit of
# its `main`: c813472f6591a1e06e66ed77ec39d26cb061cf4a, committed on 2026-11-19.
# The pin moves to a released version with the full switch.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  nebensound:
    uses: Nebensound/pipeline/.github/workflows/nebensound.yml@c813472f6591a1e06e66ed77ec39d26cb061cf4a
    permissions:
      contents: read
